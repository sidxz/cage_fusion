[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cage-fusion"
version = "0.2.0"
authors = [
  { name="Your Name", email="you@example.com" },
]
description = "Multimodal molecular property prediction — HuggingFace-style API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "scikit-learn",
    "h5py",
    "tqdm",
    "joblib",
    "transformers",
    "huggingface-hub",
    "chemprop>=2.2.0",
    "rdkit>=2024.09",
    "matplotlib",
    "seaborn",
    "pillow",
    "rich",
    "loguru",
    "fastapi",
    "uvicorn",
    "hf-transfer",
    "PyTDC",
    "datasets",
    "setuptools<71",  # pkg_resources (required by PyTDC) was dropped in setuptools 71+
]

[dependency-groups]
dev = ["deepchem"]

[tool.setuptools.packages.find]
include = ["cage_fusion*"]

[tool.setuptools.package-data]
cage_fusion = ["py.typed"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv]
override-dependencies = [
    # rdkit-pypi (pulled in by PyTDC) has no cp312 wheels.
    # We already have rdkit>=2024.09 which provides the same module.
    "rdkit-pypi; python_version < '3.12'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
