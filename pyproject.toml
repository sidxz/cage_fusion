[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cage_fusion"
version = "0.2.0"
authors = [
  { name="Your Name", email="you@example.com" },
]
description = "Multimodal molecular property prediction — HuggingFace-style API"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "scikit-learn",
    "h5py",
    "tqdm",
    "joblib",
    "transformers",
    "chemprop",
    "rdkit"
]

[tool.setuptools.package-data]
cage_fusion = ["py.typed"]
