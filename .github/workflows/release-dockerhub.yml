name: Release → Docker Hub

on:
  release:
    types: [published]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1) Free up 20–50 GB on the runner
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          # keep: 'docker'  # we do want Docker; action won't remove it by default

      - name: Show disk (before)
        run: df -h && docker system df

      # 2) Set up Buildx with aggressive GC limit (keeps BuildKit under ~8 GB)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --oci-worker-gc --oci-worker-gc-keepstorage 8GB

      # 3) Login to Docker Hub
      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4) Build & push; avoid local load to keep disk usage low
      - name: Build & push (single-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # If multi-arch was causing OOM/disk issues, start with amd64 only:
          platforms: linux/amd64
          tags: |
            sidxz/cage-fusion:${{ github.event.release.tag_name }}
            sidxz/cage-fusion:latest
          # Do NOT use local cache on small runners
          no-cache: true
          provenance: false  # tiny space save

      # 5) Hard prune anything left over
      - name: Prune Docker/Buildx
        if: always()
        run: |
          docker buildx prune -af || true
          docker system prune -af || true
          df -h && docker system df || true
