name: Release → Build & Push to Docker Hub

on:
  release:
    types: [published]   # fires when you publish a release (not draft)

jobs:
  docker:
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}   # skip prereleases; remove if you want them
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            sidxz/cage-fusion:${{ github.event.release.tag_name }}
            sidxz/cage-fusion:latest
          # Optional build cache (uncomment if you want registry caching)
          # cache-from: type=registry,ref=sidxz/cage-fusion:buildcache
          # cache-to:   type=registry,ref=sidxz/cage-fusion:buildcache,mode=max
