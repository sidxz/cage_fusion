name: cage-fusion
channels:
  - conda-forge
dependencies:
  - python=3.11
  # Core compute
  # If you prefer the official PyTorch channel instead of conda-forge, use:
  # - pytorch
  # - pytorch-cuda=12.1      # and add the 'pytorch' channel above

  # ML / data
  - rdkit>=2024.09
  - numpy
  - pandas
  - scikit-learn
  - h5py

  # Viz
  - matplotlib
  - seaborn
  - pillow

  # Dev/UX
  - tqdm
  - rich
  - joblib
  - loguru

  # API
  - fastapi
  - uvicorn

  # HF stack
  - transformers

  - pip
  - pip:
      - chemprop>=2.2.0
      - lightning>=2.6.0
      - hf_transfer
